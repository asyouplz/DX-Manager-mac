name: Windows .NET Framework validation

on:
  pull_request:
    paths:
      - ".github/workflows/windows-validation.yml"
      - "DexManager/**"
      - "DexManager.AdbProxy/**"
      - "DexManager.WindowsTests/**"
      - "Shared/**"
      - "DXLoopback/**"
      - "tools/loopback/**"
      - "scripts/Build-DexLoopback.ps1"
      - "global.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-validation.yml"
      - "DexManager/**"
      - "DexManager.AdbProxy/**"
      - "DexManager.WindowsTests/**"
      - "Shared/**"
      - "DXLoopback/**"
      - "tools/loopback/**"
      - "scripts/Build-DexLoopback.ps1"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare pinned .NET Framework 4.6.2 reference assemblies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'net462.nupkg'
          $destination = Join-Path $env:RUNNER_TEMP 'net462-references'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net462/1.0.3/microsoft.netframework.referenceassemblies.net462.1.0.3.nupkg' -OutFile $archive
          $expected = 'ee692a845743500910855d4c330ca6e9ef87c16e16f740e4474d187185d66e21'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'The .NET Framework reference package checksum does not match.'
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $destination)
          "DXM_TARGET_FRAMEWORK_ROOT=$destination\build" >> $env:GITHUB_ENV

      - name: Restore Windows ADB proxy without product package dependencies
        shell: pwsh
        run: dotnet restore DexManager.AdbProxy/DexManager.AdbProxy.csproj -p:TargetFrameworkRootPath="$env:DXM_TARGET_FRAMEWORK_ROOT"

      - name: Build Windows x64 application and proxy for .NET Framework 4.6.2
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild DexManager/DexManager.csproj /t:Build /p:Configuration=Release /p:TargetFrameworkRootPath="$env:DXM_TARGET_FRAMEWORK_ROOT" /warnaserror /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Windows .NET Framework build failed.' }

      - name: Run Windows-source regression tests
        run: dotnet run --project DexManager.WindowsTests/DexManager.WindowsTests.csproj --configuration Release

      - name: Run .NET Framework ADB proxy self-test
        shell: pwsh
        run: |
          & .\DexManager.AdbProxy\bin\Release\net462\DXMAdbProxy.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ADB proxy self-test failed.' }

      - name: Verify bundled loopback helper integrity
        shell: pwsh
        run: |
          $jar = '.\tools\loopback\dxm-loopback.jar'
          $expected = ((Get-Content "$jar.sha256" -Raw).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[a-f0-9]{64}$') { throw 'Invalid helper checksum format.' }
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $expected) { throw 'Helper checksum mismatch.' }
          $source = Get-Content '.\DexManager\Services\LoopbackDexService.cs' -Raw
          $pinned = [regex]::Match($source, 'HelperSha256\s*=\s*"([a-fA-F0-9]{64})"').Groups[1].Value
          if ($pinned -ne $expected) { throw 'The runtime and bundled helper checksums do not match.' }
          $copy = '.\DexManager\bin\Release\tools\loopback\dxm-loopback.jar'
          if ((Get-FileHash $copy -Algorithm SHA256).Hash -ne $expected) { throw 'Build output helper checksum mismatch.' }
